<!DOCTYPE html>
<html>
<body>
    <form method="POST" enctype="multipart/form-data">
        {{ form.hidden_tag() }}
        <p>
            {{ form.file.label }}<br>
            {{ form.file(size=32) }}
        </p>
        <p>
            {{ form.checkbox1.label }}<br>
            {{ form.checkbox1() }}
        </p>
        <p>
            {{ form.checkbox2.label }}<br>
            {{ form.checkbox2() }}
        </p>
        <p>
          {{ form.checkbox3.label }}<br>
          {{ form.checkbox3() }}
      </p>

        <p>
            {{ form.convert() }} 

        </p>
    </form>
</body>
</html>
